version: '1.0'
name: genshin-wiki-map
displayName: GenshinWikiMap 自动生成资源

triggers:
  push:
    - matchType: PRECISE
      branch: master

commitMessage: ''

stages:
  - name: generate-zip
    displayName: 生成并推送资源
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@python
        name: generate_zip
        displayName: 安装依赖、生成资源并推送
        pythonVersion: '3.9'
        commands:
          - |
            set -eu

            echo "===== 检查提交 ====="
            if git log -1 --pretty=%s | grep -Fq ':wrench: 更新文件'; then
              echo "自动生成资源的提交，跳过本次构建。"
              exit 0
            fi

            echo "===== 检查环境 ====="
            python3 --version
            git --version
            git lfs version

            echo "===== 配置 Git LFS ====="
            git lfs install --local
            git config lfs.fetchexclude "resources/**/*.zip"
            git lfs track "*.zip"

            echo "===== 安装 Poetry ====="
            python3 -m pip install --upgrade pip
            python3 -m pip install poetry

            echo "===== 安装依赖 ====="
            poetry install

            echo "===== 生成资源 ====="
            poetry run python generate.py

            echo "===== 配置提交信息 ====="
            git config user.name "gitee-go[bot]"
            git config user.email "gitee-go[bot]@users.noreply.gitee.com"

            echo "===== 暂存文件 ====="
            git add -A -- '*.json' '*.zip'
            git add .gitattributes 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "没有需要提交的文件。"
              exit 0
            fi

            git commit -m ":wrench: 更新文件"

            echo "===== 检查推送凭据 ====="
            test -n "${GITEE_USERNAME:-}" || {
              echo "缺少变量 GITEE_USERNAME"
              exit 1
            }
            test -n "${GITEE_TOKEN:-}" || {
              echo "缺少变量 GITEE_TOKEN"
              exit 1
            }

            echo "===== 推送到 master ====="
            AUTH="$(printf '%s:%s' "$GITEE_USERNAME" "$GITEE_TOKEN" | base64 | tr -d '\n')"
            trap 'unset AUTH' EXIT

            git -c http.extraheader="Authorization: Basic $AUTH" \
              push https://gitee.com/tonykun/GenshinWikiMap.git \
              HEAD:refs/heads/master

            echo "===== 完成 ====="
