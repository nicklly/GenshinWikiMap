
version: "1.0"
name: genshin-wiki-map
displayName: GenshinWikiMap 自动生成资源

stages:
  - name: generate_and_push
    displayName: 生成并推送资源
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@python
        name: generate_zip
        displayName: 安装依赖、生成资源并推送 JSON
        pythonVersion: "3.9"
        commands:
          - |
            set -eu

            echo "===== 检查运行环境 ====="
            python --version
            python -m pip --version
            git --version

            echo "===== 配置 Git 身份 ====="
            git config user.name "Gitee Go"
            git config user.email "gitee-go@noreply.gitee.com"

            echo "===== 备份原始依赖配置 ====="
            cp pyproject.toml /tmp/pyproject.toml.gitee-go.bak

            if [ -f poetry.lock ]; then
              cp poetry.lock /tmp/poetry.lock.gitee-go.bak
              HAD_LOCK=1
            else
              HAD_LOCK=0
            fi

            restore_dependency_files() {
              echo "===== 恢复原始依赖配置 ====="
              cp /tmp/pyproject.toml.gitee-go.bak pyproject.toml

              if [ "$HAD_LOCK" = "1" ]; then
                cp /tmp/poetry.lock.gitee-go.bak poetry.lock
              else
                rm -f poetry.lock
              fi
            }

            trap restore_dependency_files EXIT

            echo "===== 使用清华源安装 Poetry ====="
            export PIP_INDEX_URL="https://pypi.tuna.tsinghua.edu.cn/simple"

            python -m pip install --user --upgrade poetry \
              -i "$PIP_INDEX_URL"

            echo "===== 验证 Poetry ====="
            python -m poetry --version

            echo "===== 添加临时清华镜像源 ====="
            python -m poetry source add \
              --priority=primary \
              tsinghua-temp \
              https://pypi.tuna.tsinghua.edu.cn/simple/

            echo "===== 添加临时阿里镜像源 ====="
            python -m poetry source add \
              --priority=supplemental \
              aliyun-temp \
              https://mirrors.aliyun.com/pypi/simple/

            echo "===== 同步临时锁文件 ====="
            python -m poetry lock --no-interaction

            echo "===== 使用临时镜像安装依赖 ====="
            python -m poetry install --no-interaction --no-ansi

            echo "===== 恢复原始依赖配置和锁文件 ====="
            restore_dependency_files
            trap - EXIT

            echo "===== 从 Git 索引移除旧 ZIP ====="
            git rm --cached --ignore-unmatch \
              resources/genshin_resources.zip

            echo "===== 生成游戏资源 ====="
            python -m poetry run python generate.py

            echo "===== 检查生成结果 ====="
            test -f resources/genshin_resources.zip
            ls -lh resources/genshin_resources.zip

            echo "===== 暂存 JSON 和 .gitignore ====="
            git add -A -- '*.json' .gitignore

            if ! git diff --cached --quiet; then
              git commit -m "自动更新游戏资源 JSON"
            else
              echo "没有检测到 JSON 或 .gitignore 变更"
            fi

            echo "===== 检查 Gitee 推送凭据 ====="
            : "${USERNAME:?缺少流水线变量 USERNAME}"
            : "${TOKEN:?缺少流水线变量 TOKEN}"

            echo "===== 推送 JSON 到 master ====="
            AUTH="$(printf '%s:%s' "$USERNAME" "$TOKEN" | base64 | tr -d '\n')"

            git -c "http.https://gitee.com/.extraheader=Authorization: Basic ${AUTH}" \
              push https://gitee.com/tonykun/GenshinWikiMap.git \
              HEAD:refs/heads/master

            unset AUTH

            echo "===== 资源生成与 JSON 推送完成 ====="
        artifacts:
          - name: GENSHIN_RESOURCES
            path:
              - resources/genshin_resources.zip
        caches:
          - /root/.cache/pypoetry
          - /root/.cache/pip
        notify: []
        strategy:
          retry: "0"

  - name: publish_release
    displayName: 发布资源 Release
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: 发布 resources-latest
        releaseName: GenshinWikiMap 最新资源
        description: 自动生成的 GenshinWikiMap 游戏资源压缩包。
        tagName: resources-latest
        upstreamArtifact:
          - GENSHIN_RESOURCES
        assertFiles:
          - resources/genshin_resources.zip
        prerelease: false
        allowUpdate: true
        notify: []
        strategy:
          retry: "0"

triggers:
  trigger: auto

notify: []

ref_variable:
  - TOKEN
  - USERNAME
