name: Generate Zip File

on:
  push:
    branches:
      - master
    paths:
      - 'data/**.json'
      - 'resources/**'
      - '!resources/splash/**'
      - '!resources/genshin_resources.zip'

  workflow_dispatch:

jobs:
  GenerateZipFile:
    runs-on: [ubuntu-latest, x64, small]

    steps:
      - name: Checkout source
        uses: checkout

      - name: Set up Python
        uses: setup-python
        with:
          python-version: '3.9'

      - name: Set up Git LFS
        run: |
          git lfs install --local
          git config lfs.fetchexclude "resources/**/*.zip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Generate files
        run: |
          poetry run python generate.py

      - name: Prepare Git LFS
        run: |
          git lfs track "*.zip"

      - name: Commit generated files
        run: |
          git add '*.json' '*.zip'

          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi

          git config user.name "gitcode-actions[bot]"
          git config user.email "gitcode-actions[bot]@users.noreply.github.com"

          git commit -m ":wrench: 更新文件"

      - name: Push changes
        run: |
          git push origin HEAD:refs/heads/master